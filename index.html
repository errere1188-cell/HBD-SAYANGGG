<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Alifah Syahab 🎂</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, #ffdle8, #ffc0cb, #ffe4f2);
            overflow-x: hidden;
            color: #fff;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            position: relative;
        }

        .hero h1 {
            font-family: 'Pacifico', cursive;
            font-size: 4rem;
            margin-bottom: 15px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.2);
            color: #fff;
        }

        .hero p {
            max-width: 700px;
            font-size: 1.2rem;
            margin-bottom: 30px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.1);
            color: #fff;
        }

        /* Desain tombol musik kustom agar serasi dengan tema pink */
        .btn-music {
            background: linear-gradient(135deg, #ff69b4, #ffb6c1);
            color: #ffffff;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .btn-music:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.6);
        }

        /* Animasi gelombang suara halus */
        .music-waves {
            display: none;
            justify-content: center;
            align-items: flex-end;
            gap: 3px;
            height: 20px;
            margin-top: 20px;
        }

        .wave {
            width: 4px;
            height: 5px;
            background-color: #fff;
            border-radius: 2px;
        }

        .playing .wave {
            animation: bounce 0.6s infinite ease-in-out alternate;
        }

        .playing .wave:nth-child(2) { animation-delay: 0.2s; }
        .playing .wave:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            from { height: 5px; }
            to { height: 25px; }
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>Happy Birthday Alifah Syahab 🎂</h1>
        <p>🎵 "Do you think I have forgotten about you?" 🎵</p>
        
        <!-- Tombol Musik -->
        <button class="btn-music" id="musicBtn" onclick="toggleMusic()">
            <span id="btnIcon">▶</span> <span id="btnText">Putar Musik</span>
        </button>

        <!-- Mini Wave -->
        <div class="music-waves" id="waveContainer">
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
        </div>
    </div>

    <!-- Sumber lagu About You - The 1975 -->
    <audio id="myAudio" loop>
        <source src="https://pub-c5e31b5cdafb419a86a69d5d340a9dac.r2.dev/The%201975%20-%20About%20You.mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('myAudio');
        const musicBtn = document.getElementById('musicBtn');
        const btnIcon = document.getElementById('btnIcon');
        const btnText = document.getElementById('btnText');
        const waveContainer = document.getElementById('waveContainer');

        function toggleMusic() {
            if (audio.paused) {
                audio.play().then(() => {
                    btnIcon.innerText = "⏸";
                    btnText.innerText = "Jeda Musik";
                    waveContainer.style.display = "flex";
                    waveContainer.classList.add('playing');
                }).catch((error) => {
                    alert("Klik sekali lagi untuk memutar lagu!");
                });
            } else {
                audio.pause();
                btnIcon.innerText = "▶";
                btnText.innerText = "Putar Musik";
                waveContainer.classList.remove('playing');
            }
        }
    </script>

</body>
</html>
